name: Lint/Test

on:
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Format
        uses: psf/black@87928e6d6761a4a6d22250e1fee5601b3998086e # stable

  test:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'

      - run: pip install -r requirements.txt

      - name: Unit Tests
        env:
          PYTHONPATH: .
        run: |
          set -o pipefail
          pytest --junitxml=pytest.xml --cov=src tests/test*.py | tee pytest-coverage.txt

      - name: Comment coverage
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: MishaKav/pytest-coverage-comment@fd9adbdca9fdfbe2b9bfa44a7340e6a83346ce6c # v1.10.0
        with:
          pytest-coverage-path: ./pytest-coverage.txt
          junitxml-path: ./pytest.xml
